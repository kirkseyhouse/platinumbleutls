name: Dashboard CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.15.0'
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run check
      - run: npm run security:scan
      - name: Verify signed push commit
        if: github.event_name == 'push'
        run: git -c gpg.format=ssh -c gpg.ssh.allowedSignersFile=deploy/allowed-signers verify-commit HEAD
      - run: python3 -m unittest discover -s tests -p '*_test.py'
      - run: python3 scripts/render-cloud-build.py --check
