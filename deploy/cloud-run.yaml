# Reviewable template, not an approved deployment. Project number: 531881403960.
# Replace REQUIRED_* with the approved digest and numbered secret versions.
# Deploy behind a managed HTTPS load balancer with restricted service ingress.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: pb-dashboard
  labels:
    cloud.googleapis.com/location: us-central1
  annotations:
    run.googleapis.com/ingress: internal-and-cloud-load-balancing
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: '0'
        autoscaling.knative.dev/maxScale: '5'
        run.googleapis.com/network-interfaces: '[{"network":"pb-prod-vpc","subnetwork":"pb-prod-us-central1","tags":"pb-dashboard"}]'
        run.googleapis.com/vpc-access-egress: private-ranges-only
    spec:
      serviceAccountName: pb-dashboard-runtime@platinum-bleu-drive.iam.gserviceaccount.com
      containerConcurrency: 8
      timeoutSeconds: 60
      containers:
        - image: REQUIRED_IMAGE_DIGEST
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: '1'
              memory: 512Mi
          env:
            - name: NODE_ENV
              value: production
            - name: HOST
              value: 0.0.0.0
            - name: APP_ORIGIN
              value: https://ops.platinumbleutls.com
            - name: OPERATIONAL_MODE
              value: hcp_coexistence
            - name: INSTANCE_CONNECTION_NAME
              value: platinum-bleu-drive:us-central1:pb-prod-sql
            - name: DB_NAME
              value: platinum_bleu
            - name: DB_IAM_USER
              value: pb-dashboard-runtime@platinum-bleu-drive.iam
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: pb-google-client-id
                  key: REQUIRED_GOOGLE_CLIENT_ID_VERSION
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: pb-google-client-secret
                  key: REQUIRED_GOOGLE_CLIENT_SECRET_VERSION
          startupProbe:
            periodSeconds: 10
            failureThreshold: 24
            httpGet:
              path: /healthz
              port: 8080
